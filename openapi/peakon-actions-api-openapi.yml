              - trying_new_things
              - values
              - values_fit
              - when
              - where
              - willing_to_help
              - work_environment
              - work_meaning
            group:
              type: string
            completedAt:
              type: string
              format: date-time
            archivedAt:
              type: string
              format: date-time
            access:
              type: string
              enum:
              - private
              - shared
            dueAt:
              type: string
              format: date-time
            text:
              type: string
            notes:
              type: string
      type: object
