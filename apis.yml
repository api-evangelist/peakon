aid: peakon
name: Peakon
description: >-
  Peakon (now Workday Peakon Employee Voice) is an employee engagement and experience
  platform for measuring and improving engagement through continuous surveys, driver
  analytics, and action-taking. Founded in Copenhagen and backed by Atomico and Balderton
  Capital, it was acquired by Workday in 2021. Peakon exposes a public REST API (v1.1.0,
  JSON:API) for reading engagement overviews, drivers, segment and category scores, survey
  answers, and audits, plus managing employees; it also offers a SCIM 2.0 provisioning API
  for continuous HRIS-driven user sync. Applications authenticate by exchanging a custom-app
  access token for a session bearer JWT scoped by per-app permissions.
